name: Tests and update package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, xml
      - run: composer validate --no-check-publish
        name: Validate Composer configuration
      - run: composer install --no-interaction --prefer-dist
        name: Install development dependencies
      - run: find local tests updates -type f -name '*.php' -print0 | xargs -0 -n1 php -l
        name: Lint PHP sources
      - run: vendor/bin/phpunit
        name: Run unit tests

  update-package:
    name: Build Bitrix update package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate 0.1.1 package
        run: bash scripts/build-update.sh 0.1.1
      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: codematrix-integrationinspector-0.1.1
          path: dist/0.1.1.zip
          if-no-files-found: error
          retention-days: 14
